apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: idp-portal
  description: Internal Developer Portal
  annotations:
    # Tells Backstage which cluster resources belong to this entity.
    # The matching label `backstage.io/kubernetes-id: idp-portal` must be
    # present on the Deployment (and its Pods) in the cluster.
