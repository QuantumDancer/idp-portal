stages:
  - build
  - package
  - deploy

variables:
  DEPLOYMENT_REPO: idp/platform/idp-portal-deployment

# Host build: install deps, type-check, and bundle the backend
build:
  stage: build
  image: node:24-trixie-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git python3 g++ build-essential
  cache:
    key: yarn-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - corepack enable
    - yarn install --immutable
    - yarn tsc
    - yarn build:backend
  artifacts:
    paths:
      - packages/backend/dist/
    expire_in: 1 hour

# Build the Docker image and push to the GitLab container registry
docker:
  stage: package
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # --provenance=false: Docker generates attestation manifests by default,
    # producing an OCI index instead of a plain image manifest. GitLab's
    # container registry doesn't display digests correctly for these multi-manifest
    # images. See https://gitlab.com/gitlab-org/gitlab/-/issues/388865
    # TODO: This seems to be an old issue. Find out why I'm still affected by this,
    # even though I run an up-to-date GitLab instance.
    - docker build -f packages/backend/Dockerfile --provenance=false -t $IMAGE_TAG .
    - docker push $IMAGE_TAG

# Update the image tag in the GitOps deployment repo
.deploy:
  stage: deploy
  image: alpine:3
  before_script:
    - apk add --no-cache git
    - wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
    - chmod +x /usr/local/bin/yq
    - git config --global user.email "gitlab-ci@${CI_SERVER_HOST}"
    - git config --global user.name "GitLab CI"
    - git clone -b "${DEPLOYMENT_BRANCH}" "https://deploy:${DEPLOYMENT_TOKEN}@${CI_SERVER_HOST}/${DEPLOYMENT_REPO}.git" /tmp/deployment
  script:
    - yq -i ".image.tag = \"${CI_COMMIT_SHORT_SHA}\"" /tmp/deployment/environments/${ENVIRONMENT}.yaml
    - cd /tmp/deployment
    - git add environments/${ENVIRONMENT}.yaml
    - git commit -m "Deploy ${CI_PROJECT_NAME} ${CI_COMMIT_SHORT_SHA} to ${ENVIRONMENT}"
    - git push

deploy:homelab:
  extends: .deploy
  variables:
    ENVIRONMENT: homelab
    DEPLOYMENT_BRANCH: development
  environment:
    name: homelab
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

deploy:development:
  extends: .deploy
  variables:
    ENVIRONMENT: development
    DEPLOYMENT_BRANCH: development
  environment:
    name: development
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
