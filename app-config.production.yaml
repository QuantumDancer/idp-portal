app:
  title: Ben's IDP Portal
  baseUrl: ${BASE_URL}

backend:
  baseUrl: ${BASE_URL}
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # Configures which plugin namespaces the MCP server exposes as tools.
  # Each source maps to the actions registered by that plugin.
  #  - 'catalog' exposes entity queries and validation
  #  - 'scaffolder' exposes template actions
  #  - 'techdocs' exposes get-metadata and get-content (registered by
  #    packages/backend/src/techdocs/module.ts)
  # Future integrations to consider: 'kubernetes' (once the k8s plugin registers actions),
  # 'crossplane' and 'kyverno' (once added to backstage), and any custom scaffolder action modules
  # added to packages/backend/src/scaffolder/.
  actions:
    pluginSources:
      - 'catalog'
      - 'scaffolder'
      - 'techdocs'
  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

integrations:
  gitlab:
    - host: gitlab.home.rottlr.de
      token: ${GITLAB_TOKEN}
      apiBaseUrl: https://gitlab.home.rottlr.de/api/v4

auth:
  environment: homelab
  providers:
    gitlab:
      homelab:
        clientId: ${AUTH_GITLAB_CLIENT_ID}
        clientSecret: ${AUTH_GITLAB_CLIENT_SECRET}
        audience: https://gitlab.home.rottlr.de
        sessionDuration: { hours: 4 }
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
  # MCP clients (Claude Desktop, Cursor, etc.) obtain per-user tokens via an OAuth browser
  # flow rather than a shared static token — permissions and audit logs match the web UI.
  experimentalDynamicClientRegistration:
    enabled: true

kubernetes:
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - name: Homelab
          # url is required by the config schema but bypassed when serviceAccountToken is
          # absent — Backstage uses the pod's auto-mounted service account (in-cluster) instead.
          url: https://kubernetes.default.svc.cluster.local
          authProvider: 'serviceAccount'

argocd:
  appLocatorMethods:
    - type: 'config'
      instances:
        - name: homelab
          url: https://argocd.k8s.home.rottlr.de
          token: ${ARGOCD_HOMELAB_TOKEN}

techdocs:
  builder: 'external'
  generator:
    runIn: 'local'
  publisher:
    type: 'awsS3'
    awsS3:
      bucketName: ${TECHDOCS_S3_BUCKET}
      region: ${TECHDOCS_S3_REGION}
      endpoint: ${TECHDOCS_S3_ENDPOINT}
      s3ForcePathStyle: ${TECHDOCS_S3_FORCE_PATH_STYLE}

catalog:
  providers:
    gitlab:
      yourProviderId:
        # https://backstage.io/docs/integrations/gitlab/discovery
        host: gitlab.home.rottlr.de
        branch: main
        group: idp
        schedule:
          frequency: { minutes: 10 }
          timeout: { minutes: 3 }
        # https://backstage.io/docs/integrations/gitlab/org
        orgEnabled: true
        relations:
          - INHERITED
          - SHARED_FROM_GROUPS
        rules:
          - allow: [Group, User]
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template]
